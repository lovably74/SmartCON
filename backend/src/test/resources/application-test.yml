# 테스트 환경 설정 - H2 인메모리 데이터베이스 사용
spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
  
  jpa:
    hibernate:
      ddl-auto: create-drop  # 테스트용 자동 스키마 생성
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        '[format_sql]': false
        '[use_sql_comments]': false
  
  flyway:
    enabled: false  # 테스트에서는 Flyway 비활성화
  
  h2:
    console:
      enabled: true  # 테스트용 H2 콘솔 활성화

# JWT 설정 (테스트용)
jwt:
  secret: test-secret-key-for-jwt-token-service-testing-purposes-only-minimum-32-chars
  access-token-expiration-minutes: 60
  refresh-token-expiration-days: 7
  use-rsa: false
  issuer: smartcon-lite
  audience: smartcon-api

# 로깅 설정 (테스트용)
logging:
  level:
    com.smartcon: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.flywaydb: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"